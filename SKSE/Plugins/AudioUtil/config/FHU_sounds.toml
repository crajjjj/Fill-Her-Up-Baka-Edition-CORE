# Fill Her Up Baka Edition additive overlay for AudioUtil (https://crajjjj.github.io/AudioUtil/).
#
# FHU's deflation/denial lines are VOICE content, so they live in a voice slot
# (FHU1 below), not the [sfx] table. Playback (sr_IntAudioUtil.TryVoice) is
# two-step: PlayVoice on the actor first - so a voice pack that ships an FHU_*
# category plays it in the actor's own voice, and a gagged actor gets her
# muffled gag slot - then PlayVoiceFromSlot("FHU1", ...) for FHU's stock line
# when no pack ships the category. Legacy Sound-marker forms remain the
# fallback when the DLL is absent. Voice packs that just re-record the wavs
# keep working with no toml at all - same folders, higher file priority.
#
# This file is additive only: the FHU1 slot and the [groups] fhu volume below.
# It sets no base-only globals ([general]/[lipsync]/[gag] toggles) - those live
# in the installed BASE AudioUtil.toml (SLO VE's or another preset).
# Key/name matching is case- and space-insensitive. Reload in-game: au reload.

[groups]
# FHU's lines play in their own "fhu" volume group (passed on both TryVoice
# calls in sr_IntAudioUtil), separate from the shared pc/partner voice groups -
# so FHU audio has its own level the voice-pack's voice slider does not touch.
# No MCM: edit this 0.0-1.0 value and `au reload`. [groups] is additive, so
# this merges onto the base without overriding it.
fhu = 1.0

# FHU-bundled voice lines, reached via PlayVoiceFromSlot("FHU1", ...) - never
# resolved from an actor (sex "all" keeps it out of the blind default-by-sex
# fallback). Category names match what TryVoice requests from the actor's pack
# first, so a pack overrides a line by shipping a folder of the same name.
# Moan+squelch deflation audio:
[[slot]]
id = "FHU1"
sex = "all"
script_only = true   # played directly via PlayVoiceFromSlot; suppresses the wiring-audit orphan warning
[slot.categories]
FHU_DeflateVaginalMild = 'Sound\fx\FillHerUp\VaginalCumDeflate\Mild'
FHU_DeflateVaginalHard = 'Sound\fx\FillHerUp\VaginalCumDeflate\Hard'
FHU_DeflateAnalMild = 'Sound\fx\FillHerUp\AnalCumDeflate\Mild'
FHU_DeflateAnalHard = 'Sound\fx\FillHerUp\AnalCumDeflate\Hard'
FHU_DeflateOral = 'Sound\fx\FillHerUp\OralCumDeflate'          # expelling it back out of the mouth
FHU_DeflateOralFail = 'Sound\fx\FillHerUp\OralCumDeflationFail' # gag/choke - the expulsion fails
FHU_DeflateOralAfter = 'Sound\fx\FillHerUp\OralCumDeflateAfter' # gasps after the expulsion
FHU_CumDenial = 'Sound\fx\FillHerUp\CumDenial'                  # wants to expel but can't (plug/belt)
# Stock pools registered for completeness - played via legacy Sound forms today
# (sr_FHUMoanMildMarker/sr_FHUMoanHardMarker are reserved for a future burst
# effect), resolvable by name for audits and other consumer mods.
FHU_MoanMild = 'Sound\fx\FillHerUp\CumDeflationMild'
FHU_MoanHard = 'Sound\fx\FillHerUp\CumDeflationHard'

# No [gag] entries on purpose: FHU's sr_linga* tongue overlays are an ahegao
# visual, not a mouth-occupying gag - registering them would muffle the actor's
# voice lines from every AudioUtil consumer (SLO VE scene dialogue included)
# for as long as the tongue is worn.
